name: Daily NFL Fantasy Data ETL

on:
  schedule:
    - cron: '0 6 * * *'  # Runs automatically every day at 06:00 UTC
  workflow_dispatch:      # Allows a manual "Run workflow" button in GitHub

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pandas nflreadpy pyarrow

      - name: Run ETL Script
        run: python etl.py

      - name: Commit and push updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily NFL data refresh" && git push)